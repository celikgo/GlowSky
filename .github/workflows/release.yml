# Cut a release from a tag.
#
# Fires on `v*` tags only. Everything it publishes is built here, from the tagged
# commit — nothing is uploaded by hand, so what a user downloads is what the tag says.
#
# What ships:
#   - a versioned CONTAINER IMAGE on GHCR, so `docker compose up` can pin a tag instead
#     of tracking main;
#   - DESKTOP BUNDLES for macOS, Windows and Linux, built by Tauri;
#   - a GitHub Release carrying both, with the validation status stated in the body.
#
# What deliberately does NOT ship: a PyPI package. The backend is a self-hosted service,
# not a library, and nothing in the docs claims otherwise. Publishing `glowsky` to PyPI
# would create an install path that is not the supported one.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build (e.g. v0.1.0)'
        required: true

permissions:
  contents: write   # create the release and upload assets
  packages: write   # push the image to GHCR

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Nothing is published until the tagged commit passes its own gates. A release built
  # from a red commit is worse than no release: it carries the project's name.
  verify:
    name: the tagged commit passes its gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: The tag matches the version in the files
        # tests/test_version_consistency.py already checks the four declarations agree
        # with each other; this checks they agree with the TAG, which only exists here.
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          DECLARED="$(python -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")"
          if [ "$VERSION" != "$DECLARED" ]; then
            echo "::error::tag $TAG implies version $VERSION but pyproject.toml declares $DECLARED"
            exit 1
          fi
          echo "tag $TAG matches declared version $DECLARED"

      - name: Lint, types, tests
        run: |
          ruff check apps services tests scripts migrations
          mypy
          pytest -q --cov=services --cov=apps --cov-fail-under=85

  image:
    name: container image
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Tag the exact version, the minor line, and latest. A user pinning
          # :0.1 gets patch fixes; one pinning :0.1.0 gets exactly this build.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/api.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=api

  desktop:
    name: desktop bundle (${{ matrix.name }})
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      # One platform failing must not deny the other two their artifacts; the release
      # job attaches whatever was produced and says what is present.
      fail-fast: false
      matrix:
        include:
          - { name: macos-arm64, os: macos-14 }
          - { name: windows-x64, os: windows-2022 }
          - { name: linux-x64, os: ubuntu-22.04 }
    steps:
      - uses: actions/checkout@v5

      # Tauri's Linux target builds against the system webkit2gtk; ubuntu-22.04 is
      # pinned rather than -latest because 24.04 ships webkit2gtk-4.1 under a different
      # package name and the two are not interchangeable.
      - name: Linux build dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Install JS deps
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      # No code signing: these bundles are unsigned, which macOS and Windows will both
      # warn about on first launch. Signing needs an Apple Developer ID and an
      # Authenticode certificate, and shipping unsigned-but-honest is better than not
      # shipping. The release body says so plainly rather than letting a user discover
      # it from an OS dialog.
      - name: Build the bundle
        working-directory: apps/desktop
        run: pnpm tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/release/bundle/macos/*.app.tar.gz
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: warn

  publish:
    name: publish the release
    needs: [verify, image, desktop]
    # `always()` so a platform whose bundle failed does not block the release; the body
    # then lists what is actually attached instead of promising three bundles.
    if: always() && needs.verify.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: desktop-*
          merge-multiple: true

      - name: List what was built
        run: |
          mkdir -p artifacts
          find artifacts -type f | sort || true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: artifacts/**/*
          body: |
            ## Glowsky ${{ github.event.inputs.tag || github.ref_name }}

            AI-native workspace for small-molecule drug design. LLMs plan and explain;
            deterministic chemistry computes.

            ### Container image

            ```bash
            docker pull ghcr.io/${{ github.repository }}:${{ github.event.inputs.tag || github.ref_name }}
            ```

            ### Desktop bundles

            Attached below, for macOS, Windows and Linux. **They are unsigned.** macOS
            will need Gatekeeper overridden on first launch and Windows will show a
            SmartScreen warning; code signing needs an Apple Developer ID and an
            Authenticode certificate, and neither is in place yet. If a platform's
            bundle is missing from this list, its build failed — the release is not
            claiming to ship what is not here.

            ### Before you run it

            Set `GLOWSKY_SECRET_KEY` to a real Fernet key. Without it a non-development
            instance **refuses to boot**, by design, rather than encrypt your BYO-LLM
            provider keys under the public in-source development key. See
            [SECURITY.md](https://github.com/${{ github.repository }}/blob/main/SECURITY.md).

            ### What this release does and does not claim

            The predictors return uncertainty, applicability domain and provenance, and
            [`docs/VALIDATION.md`](https://github.com/${{ github.repository }}/blob/main/docs/VALIDATION.md)
            — generated from a benchmark run, not written by hand — reports what has
            been validated against published reference values and what has not. Read it
            before quoting a number from this software. A docking score is not a binding
            affinity, and nothing here is a regulatory or safety assessment.
