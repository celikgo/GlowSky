# Glowsky local deployment — DEFAULT dev stack (SQLite, socket-free, container tools OFF).
#
#   docker compose up --build   # redis + api + worker
#   curl localhost:8000/health
#
# The API and worker run the SAME image (different commands). This default stack is
# SOCKET-FREE and does NOT register CONTAINER (docker-run) tools: built-in RDKit chemistry
# runs in-process and needs no Docker socket. The root-equivalent docker.sock mount +
# container-tool wiring live in the OPT-IN overlay docker-compose.tools.yml (GS-M3):
#   docker compose -f docker-compose.yml -f docker-compose.tools.yml up --build
# Use that overlay only on a TRUSTED single-tenant / local host. For a production-shaped
# stack (Postgres + migrations, socket-free) see docker-compose.prod.yml.
#
# MANDATORY secrets-at-rest config (GS-H1). Stored BYO-LLM credentials are Fernet-encrypted;
# the key comes from GLOWSKY_SECRET_KEY. This compose deploys with GLOWSKY_ENVIRONMENT=production,
# so the app REFUSES TO BOOT unless you supply a real GLOWSKY_SECRET_KEY (no silent fallback to
# the public in-source dev key). Generate one and export it before `docker compose up`:
#   export GLOWSKY_SECRET_KEY="$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')"
# Keep this key stable and secret: rotating it makes every already-stored credential undecryptable.
# For a throwaway local run only, set GLOWSKY_ENVIRONMENT=dev to opt in to the (insecure) dev key.
services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    command: uvicorn apps.api.main:app --host 0.0.0.0 --port 8000
    environment:
      GLOWSKY_ENVIRONMENT: production
      GLOWSKY_SECRET_KEY: ${GLOWSKY_SECRET_KEY:?set GLOWSKY_SECRET_KEY to a Fernet key — see header}
      GLOWSKY_REDIS_URL: redis://redis:6379/0
      GLOWSKY_DATABASE_URL: sqlite:////data/glowsky.db
    volumes:
      - glowsky-data:/data             # persistent SQLite
    ports:
      - "8000:8000"
    depends_on:
      - redis

  worker:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    command: celery -A services.tools.queue.celery_app worker --loglevel=info
    environment:
      GLOWSKY_ENVIRONMENT: production
      GLOWSKY_SECRET_KEY: ${GLOWSKY_SECRET_KEY:?set GLOWSKY_SECRET_KEY to a Fernet key — see header}
      GLOWSKY_REDIS_URL: redis://redis:6379/0
      GLOWSKY_DATABASE_URL: sqlite:////data/glowsky.db
    volumes:
      - glowsky-data:/data
    depends_on:
      - redis

volumes:
  glowsky-data:
