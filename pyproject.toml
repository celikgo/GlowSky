[project]
name = "glowsky"
version = "0.0.1"
description = "Glowsky — AI-native workspace for small-molecule drug design (Phase 0 scaffold)"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.1",
    "litellm>=1.40",
    "sqlalchemy>=2.0",
    "rdkit>=2024.3",
    "celery>=5.3",
    "redis>=5",
    "pyyaml>=6",
    "alembic>=1.13",
    "cryptography>=42",
    "pyjwt[crypto]>=2.8",
]

# pandas is used by exported notebooks (and to test their reproducibility), not by the
# backend itself, so it lives in the dev/optional set.
[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27", "pandas>=2.0"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "services*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "real_auth: lift the default principal override and exercise real nakitte-JWT auth",
]
